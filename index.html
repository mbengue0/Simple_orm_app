<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookstore</title>
</head>
<body>
  <h1>Bookstore</h1>
  <form id="bookForm">
    <input type="text" id="title" placeholder="Title" required>
    <input type="text" id="author" placeholder="Author" required>
    <input type="number" id="publication_year" placeholder="Publication Year">
    <button type="submit">Add Book</button>
  </form>
  <ul id="bookList"></ul>

  <script>
    const API_URL = 'http://localhost:3000/books';

    // Fetch and display books
    async function loadBooks() {
      const response = await fetch(API_URL);
      const books = await response.json();
      const bookList = document.getElementById('bookList');
      bookList.innerHTML = '';
      books.forEach(book => {
        const li = document.createElement('li');
        li.textContent = `${book.title} by ${book.author} (${book.publication_year || 'N/A'})`;
        const deleteBtn = document.createElement('button');
        deleteBtn.textContent = 'Delete';
        deleteBtn.onclick = () => deleteBook(book.id);
        li.appendChild(deleteBtn);
        bookList.appendChild(li);
      });
    }

    // Add a book
    document.getElementById('bookForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const book = {
        title: document.getElementById('title').value,
        author: document.getElementById('author').value,
        publication_year: parseInt(document.getElementById('publication_year').value) || null,
      };
      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(book),
      });
      document.getElementById('bookForm').reset();
      loadBooks();
    });

    // Delete a book
    async function deleteBook(id) {
      await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
      loadBooks();
    }

    // Initial load
    loadBooks();
  </script>
</body>
</html>
